# ---------------------------------------------------------------------------
# Render Blueprint for FilmStash Bot
#
# Deploy with: Render Dashboard -> New -> Blueprint -> point at this repo.
# Render reads this file and provisions the service below.
#
# Docs: https://render.com/docs/blueprint-spec
# ---------------------------------------------------------------------------

services:
  - type: web
    name: filmstash
    runtime: python
    plan: free
    region: frankfurt          # pick the region closest to your users
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # --- Secrets: set these in the Render dashboard, never in this file ----
      # `sync: false` tells Render to prompt for the value on first deploy and
      # keep it out of version control.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false

      # --- Webhook configuration --------------------------------------------
      # Setting WEBHOOK_URL switches the bot from polling to webhook mode.
      # Replace the hostname if your Render service gets a different name.
      - key: WEBHOOK_URL
        value: https://filmstash.onrender.com

      # Render injects PORT itself; this is only a documented fallback.
      - key: PORT
        value: 10000

      # Bind all interfaces so Render's router can reach the process.
      - key: WEBHOOK_LISTEN
        value: 0.0.0.0

      # Non-obvious path so random scanners cannot hit the endpoint.
      - key: WEBHOOK_PATH
        value: /telegram/webhook

      # Keep Python from buffering logs, so output appears in Render in real time.
      - key: PYTHONUNBUFFERED
        value: "1"
